<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Froud</title>
    <link rel="stylesheet" href="stylesheets/shopStyle.css">
    <link rel="stylesheet" href="stylesheets/style.css">
    <link rel="shortcut icon" href="img/logo3Dimage.svg" type="image/x-icon">
</head>

<body>
    <div class="logo"></div>
    <div class="burger">
        <div class="closed-burger"></div>
        <div class="opened-burger">
            <div class="close"></div>
            <div class="links-text">
                <p><a href="book.html">книга</a></p>
                <p><a href="building.html">где мы</a></p>
                <p><a href="posters.html">постеры</a></p>
                <p><a href="webBreeding.html">веб-плакаты</a></p>
                <p><a href="shop.html">магазин</a></p>
            </div>
        </div>
    </div>

    <div class="shop">
        <div class="leftPart">
            <div class="heading">
                <p>Все наши продукты в одном месте</p>
            </div>
            <div class="cards">
                <div class="productCard soda">
                    <div class="imgSoda"></div>
                    <div class="textOnCard">
                        <p class="name">Фирменная газировка</p>
                        <p class="price">150 руб.</p>
                    </div>
                    <button class="basicButton">добавить в корзину</button>
                    <button class="activeButton">добавлено в корзину</button>
                </div>

                <div class="productCard lunch">
                    <div class="imgLunch"></div>
                    <div class="textOnCard">
                        <p class="name">Ланч</p>
                        <p class="price">400 руб.</p>
                    </div>
                    <button class="basicButton">добавить в корзину</button>
                    <button class="activeButton">добавлено в корзину</button>
                </div>


                <div class="productCard milk">
                    <div class="imgMilk"></div>
                    <div class="textOnCard">
                        <p class="name">Молоко</p>
                        <p class="price">89 руб.</p>
                    </div>
                    <button class="basicButton">добавить в корзину</button>
                    <button class="activeButton">добавлено в корзину</button>
                </div>

                <div class="productCard case">
                    <div class="imgCase"></div>
                    <div class="textOnCard">
                        <p class="name">Чехол на телефон</p>
                        <p class="price">349 руб.</p>
                    </div>
                    <button class="basicButton">добавить в корзину</button>
                    <button class="activeButton">добавлено в корзину</button>
                </div>

                <div class="productCard vending">
                    <div class="imgVending"></div>
                    <div class="textOnCard">
                        <p class="name">Вендинг</p>
                        <p class="price">100 000 руб.</p>
                    </div>
                    <button class="basicButton">добавить в корзину</button>
                    <button class="activeButton">добавлено в корзину</button>
                </div>
            </div>
        </div>


        <div class="cart">
            <p>Корзина</p>
            <div class="imgSmall"></div>
            <div class="nameCart"></div>
            <div class="priceCart"></div>
            <div class="plusMin"></div>
        </div>
    </div>

    <footer>
        <div class="first-column-footer">
            <p class="tg-p">Tg: @Bueeeef</p>
            <p class="email-p">Email: swallowtailnetae@gmail.com</p>
        </div>

        <div class="second-column-footer">
            <p class="hse-p">HSE DESIGN AND PROGRAMMING COURSE</p>
        </div>

        <div class="third-column-footer">
            <form action="" method="post">
                <label for="email">Связаться с нами:</label>
                <div class="input-button">
                    <input type="email" name="email" placeholder="Email" id="email">
                    <button type="submit" class="arrowButton">
                        <img src="img/arrow.svg" alt="arrow">
                    </button>
                </div>
            </form>
        </div>

    </footer>

    <script src="js/main.js" charset="UTF-8"></script>
    <script src="js/shop.js" charset="UTF-8"></script>
</body>

</html>
